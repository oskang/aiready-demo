/* Layout: a phone-sized app, framed on wide screens beside a short demo note; full-bleed on phones. Single light theme by choice (it mirrors the airport app look). */
:root{
  --sky:#DCEEF7; --sky2:#F3F9FC;
  --ink:#16252B; --ink2:#4B5B61; --mute:#8A989D; --line:#E2EAED; --paper:#FFFFFF; --soft:#F4F8F9;
  --teal:#16B1BC; --teal-d:#0E8C95; --teal-l:#E3F5F7;
  --ok:#0E8C95; --ok-bg:#E3F5F7; --ok-bd:#8BD6DC;
  --mv:#2F5F9E; --mv-bg:#EAF1FB; --mv-bd:#A9C3E8;
  --ban:#B23A3A; --ban-bg:#FDECEC; --ban-bd:#EDB0B0;
  --chk:#946200; --chk-bg:#FFF4DC; --chk-bd:#EDCF8A;
  --suit:#2B3A42; --suit-in:#E9E2D6; --cloth1:#C9D6DC; --cloth2:#D9CFC0; --cloth3:#B9CBD6;
  --f:"Pretendard Sub","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--f);color:var(--ink);background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 70%);-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-within{outline:3px solid var(--teal);outline-offset:2px}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.note{max-width:300px;min-width:0}
.note .eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--teal-d)}
.note h1{font-size:30px;line-height:1.25;margin:8px 0 14px;font-weight:700;text-wrap:balance}
.note p{font-size:15px;line-height:1.65;color:var(--ink2);margin:0 0 12px}
.note ol{margin:6px 0 0;padding-left:20px;color:var(--ink2);font-size:14.5px;line-height:1.8}
.phone{width:392px;height:820px;max-height:calc(100vh - 56px);min-height:640px;background:var(--paper);border-radius:46px;border:10px solid #121A1E;box-shadow:0 30px 60px -20px rgba(20,60,80,.35);overflow:hidden;position:relative;display:flex;flex-direction:column;flex:none}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:110px;height:28px;background:#121A1E;border-radius:16px;z-index:5}
@media (max-width:760px){
  .stage{display:block;padding:0;height:100%}
  .note{display:none}
  .phone{width:100%;height:100%;max-height:none;min-height:100%;border:0;border-radius:0;box-shadow:none}
  .notch{display:none}
  body{background:var(--paper)}
}
.bar{display:flex;align-items:center;justify-content:space-between;padding:44px 20px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
@media (max-width:760px){.bar{padding-top:14px}}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--teal);display:grid;place-items:center;color:#fff;font-style:normal;font-size:13px}

  (bag.deco||[]).forEach(d=>{s+=g(d[0],d[1],d[2],d[3],d[4],d[5],d[6]);});

  }
  return s+"</svg>";
}

function rulesText(){return Object.entries(RULES).map(([k,r])=>`[${k}] ${r.t}: ${r.x}`).join("\n");}
function buildPrompt(state){return `당신은 인천공항 출국 여객의 짐 사전점검 도우미입니다. 사진은 여객이 출국 전날 찍은 여행 가방 내부입니다. 국제선입니다. 이 가방은 ${state.mode==="k"?"위탁 수하물(카운터에서 부치는 짐)":"기내 가방(들고 타는 짐)"}입니다. 이 가방 기준으로 판정하세요. 여객은 기내 가방과 위탁 수하물을 둘 다 쓸 수 있습니다. 보조배터리는 물품명에 "보조배터리"라는 단어를 넣어 주세요.
아래 규정만 근거로 사진 속 물품을 판정하세요.
먼저 사진을 구역별로 꼼꼼히 훑어 모든 물품을 찾으세요. 옷·수건·파우치 사이에 일부만 보이는 물건(모서리, 끝부분, 케이블, 뚜껑, 다른 색 면)도 찾아서 무엇인지 추정하세요. 예: 옷 사이로 보이는 납작하고 단단한 판 모양 → 노트북·태블릿 가능성, 원통형 금속 → 스프레이·가스 가능성. 일부만 보이는 물품은 visibility="일부 가려짐"으로 표시하세요.
옷·책·충전 케이블처럼 규정과 무관한 것이 확실한 물품만 생략하세요. 판정할 물품이 없으면 빈 배열을 반환하세요.
액체·젤·스프레이 용량은 다음 순서로 판단하세요:
1) 라벨에 용량 숫자가 보이면 그 숫자를 씁니다 (basis="라벨 확인").
2) 숫자가 안 보이지만 브랜드·제품을 알아보면, 알고 있는 그 제품의 출시 용량을 참고합니다. 출시 용량이 모두 100ml 이하이거나 모두 초과면 판정하고, 100ml 양쪽에 걸치면 3)으로 갑니다 (basis="제품 인식").
3) 사진 속 다른 물건과 크기를 비교해 확실히 작거나 확실히 클 때만 판정합니다 (basis="크기 추정").
4) 그래도 애매하면 cat="chk"로 두고 용기 바닥의 용량 표기를 확인하도록 안내합니다 (basis="판단 보류").
규정은 내용물이 아니라 용기 용량 기준입니다. 남은 양으로 판단하지 마세요.
분류(cat): ok=이 가방에 그대로 둬도 됨, mv=이 가방에는 안 되지만 다른 가방(${state.mode==="k"?"기내 가방":"위탁 수하물"})으로 옮기면 됨, ban=기내·위탁 모두 불가, chk=사진만으로 판단 어려움(용량·종류 확인 필요). 물품이 무엇인지 알아볼 수 있으면 확정 판정하세요(ok/mv/ban). 예: 칼·가위 등 날붙이, 부탄가스·라이터 연료통, 라벨이나 크기로 100ml를 확실히 넘는 액체, 위탁 가방 속 보조배터리·라이터·전자담배는 확정입니다. chk는 판정에 꼭 필요한 정보가 사진에 없을 때만 쓰고(예: 100ml 근처라 용량을 알 수 없음, 배터리 Wh 미표기, 물건이 무엇인지 알 수 없을 만큼 가려짐), 무엇을 확인해야 하는지 action에 구체적으로 쓰세요. 일부 가려졌어도 무엇인지 알아볼 수 있으면 확정 판정하세요.${state.mode==="k"?" 위탁 수하물에서는 액체 100ml 제한이 적용되지 않습니다(스프레이는 개당 500ml, 인화성 불가). 액체는 basis를 생략해도 됩니다.":""}
규정:
${rulesText()}

다음 형식의 JSON 배열만 답하세요. 각 문장은 한국어, 짧고 구체적으로.
[{"name":"물품명(보이는 용량 포함)","cat":"ok|mv|ban|chk","rule":"규정 키(pb, liq 등)","reason":"판정 이유 1문장","action":"여객이 할 일 1문장","stage":"home|checkin|security","basis":"액체류만: 라벨 확인|제품 인식|크기 추정|판단 보류","bnote":"액체류만: 용량을 그렇게 판단한 근거 1문장(인식한 제품명·출시 용량 포함)","visibility":"전체|일부 가려짐","where":"사진 속 위치(예: 왼쪽 아래 옷 사이)"}]`;}
async function startUpload(file){
  if(state.photoURL&&state.photo!==file)URL.revokeObjectURL(state.photoURL);
  const url=state.photo===file&&state.photoURL?state.photoURL:URL.createObjectURL(file);
  go({screen:"scan",bag:null,photo:file,photoURL:url,step:0,live:"",error:null,items:null});
  aborter=new AbortController();
  const prompt=buildPrompt(state);
  try{
    let out;
    if(sampleFn&&canImages){
      out=await sampleFn.json(prompt,{images:[file],signal:aborter.signal,modelTier:"complex",
        onText:()=>{ if(state.screen==="scan"&&state.photo===file){ if(state.step<1){state.step=1;} render(); } }});
    }else{
      const sig=aborter.signal;
      const t1=setTimeout(()=>{if(state.screen==="scan"&&state.photo===file&&state.step<1){state.step=1;render();}},2500);
      const t2=setTimeout(()=>{if(state.screen==="scan"&&state.photo===file&&state.step<2){state.step=2;render();}},7000);
      try{out=await serverJudge(file,state.mode,sig);}finally{clearTimeout(t1);clearTimeout(t2);}
    }
    aborter=null;
    if(state.screen!=="scan"||state.photo!==file)return;
    const arr=Array.isArray(out)?out:(out&&Array.isArray(out.items)?out.items:[]);
    const items=arr.filter(x=>x&&x.name).slice(0,12).map(x=>{
      const cat=CAT[x.cat]?x.cat:"chk", rule=RULES[x.rule]?x.rule:null;
      const st=STAGE[x.stage]?x.stage:"home";
      const basis=["라벨 확인","제품 인식","크기 추정","판단 보류"].includes(x.basis)?x.basis:null;
      const bx=Array.isArray(x.box)&&x.box.length===4&&x.box.every(v=>typeof v==="number"&&isFinite(v))?x.box.map(v=>Math.min(1,Math.max(0,v))):null;
      return {nbox:bx&&bx[2]>0.005&&bx[3]>0.005?bx:null,name:String(x.name),hid:x.visibility==="일부 가려짐",where:x.where?String(x.where):"",cat,rule,basis,bnote:basis?String(x.bnote||""):"",reason:String(x.reason||""),action:String(x.action||""),
        todo:cat==="ok"?[]:[[st,String(x.action||x.name),lab(cat)]]};
    });
    state.step=3;render();
    setTimeout(()=>go({screen:"result",items,source:"live",filter:null}),400);
  }catch(e){
    aborter=null;
    if(!e||e.code==="cancelled"||e.name==="AbortError")return;
    const map={not_granted:"Claude 사용이 허용되지 않아 사진을 판정할 수 없습니다. 예시 가방으로 체험해 주세요.",sampling_disabled:"이 계정에서는 사진 판정을 쓸 수 없습니다. 예시 가방으로 체험해 주세요.",images_unavailable:"이 환경에서는 사진을 보낼 수 없습니다. 예시 가방으로 체험해 주세요.",image_rejected:"사진을 읽을 수 없습니다. JPG나 PNG 사진으로 다시 올려 주세요.",rate_limited:"요청이 많아 잠시 후 다시 시도해 주세요.",invalid_json:"결과를 정리하지 못했습니다. 다시 시도해 주세요.",refused:"이 사진은 판정할 수 없습니다. 가방 내부 사진으로 다시 올려 주세요.",bad_image:"사진을 읽을 수 없습니다. JPG나 PNG 사진으로 다시 올려 주세요.",too_large:"사진이 너무 큽니다. 다른 사진으로 올려 주세요.",no_key:"사진 판정 서버의 API 키를 확인해 주세요. 예시 가방으로 체험할 수 있습니다.",model_missing:"사진 판정 서버의 AI 모델 설정을 확인해 주세요."};
    if(["not_granted","sampling_disabled","images_unavailable"].includes(e.code)){canImages=false;}
    state.error=map[e.code]||"연결이 끊겼습니다. 다시 시도해 주세요.";render();
  }
}

// ---------- Server judge (standalone site) ----------
let serverOK=false;
function toB64(bmp,sx,sy,sw,sh,max){
  const sc=Math.min(1,max/Math.max(sw,sh));
  const c=document.createElement("canvas");c.width=Math.max(1,Math.round(sw*sc));c.height=Math.max(1,Math.round(sh*sc));
  c.getContext("2d").drawImage(bmp,sx,sy,sw,sh,0,0,c.width,c.height);
  const url=c.toDataURL("image/jpeg",0.85);return url.slice(url.indexOf(",")+1);
}
async function shrink(file){
  let bmp;
  try{bmp=await createImageBitmap(file);}catch(e){throw {code:"bad_image"};}
  const W=bmp.width,H=bmp.height,ov=0.15,hw=W/2,hh=H/2;
  const imgs=[toB64(bmp,0,0,W,H,1600)];
  // 4등분 확대 조각 (가장자리가 잘리지 않게 15%씩 겹침)
  [[0,0],[1,0],[0,1],[1,1]].forEach(([i,j])=>{
    const x=Math.max(0,i*hw-hw*ov),y=Math.max(0,j*hh-hh*ov);
    const w=Math.min(W-x,hw*(1+ov)),h=Math.min(H-y,hh*(1+ov));
    imgs.push(toB64(bmp,x,y,w,h,1200));
  });
  return imgs;
}
async function serverJudge(file,mode,signal){
  const images=await shrink(file);
  let r;
  try{r=await fetch("/api/judge",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({mode,images,mime:"image/jpeg"}),signal});}
  catch(e){if(e&&e.name==="AbortError")throw e;throw {code:"upstream_error"};}
  let d=null;try{d=await r.json();}catch(e){}
  if(!r.ok||!d)throw {code:(d&&d.code)||"upstream_error"};
  return d.items||[];
}
(async()=>{

function keepNear(it){
  if(it.cat==="ban")return false;
  if(it.rule==="ecig")return true;
  return it.rule==="pb"&&/보조\s*배터리|파워\s*뱅크|power\s*bank|배터리\s*팩/i.test(it.name||"");
}
// ---------- Result ----------
function photoMarks(items,F){
  let e="",p="";
  items.forEach((it,i)=>{const b=it.nbox;if(!b)return;if(F&&it.cat!==F)return;const col=MKCOL[it.cat];
    const cx=(b[0]+b[2]/2)*100,cy=(b[1]+b[3]/2)*100,rx=b[2]/2*100*1.12+1.5,ry=b[3]/2*100*1.12+1.5;
    e+=`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" style="stroke:${col}"/>`;
    const px=Math.min(97,Math.max(3,cx-rx*0.71)),py=Math.min(97,Math.max(3,cy-ry*0.71));
    p+=`<span class="pin" style="left:${px}%;top:${py}%;background:${col}">${i+1}</span>`;});
  return `<svg class="ovl" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${e}</svg>${p}`;
}
function renderResult(){

  const n={ok:0,mv:0,ban:0,chk:0};items.forEach(i=>n[i.cat]++);
  const F=state.filter||null;
  const pic=state.bag?bagSVG(state.bag,{marks:true,items,filter:F}):`<img src="${state.photoURL}" alt="올린 가방 사진">`;
  const todoCount=items.reduce((a,i)=>a+(i.todo?i.todo.length:0),0);
  const verdict=items.length===0?"판정이 필요한 물품을 찾지 못했어요. 가방 안이 잘 보이게 다시 찍어 보세요."
    :(n.ban+n.mv+n.chk)===0?"모두 그대로 가져가셔도 돼요."
    :`출발 전에 <em>${n.ban+n.mv+n.chk}개</em> 물품을 정리해야 해요.`;
  view.innerHTML=`<div class="pad">
    <div class="shot">${pic}</div>
    <div class="mbar"><span><b>${MODE[state.mode].n}</b> 기준 판정</span><button type="button" id="swap">${MODE[state.mode==="k"?"c":"k"].n} 기준으로 보기 ⇄</button></div>
    <div class="sum" role="group" aria-label="분류별로 보기">${Object.keys(CAT).map(k=>`<button type="button" data-f="${k}" aria-pressed="${F===k}" class="${CAT[k].c} ${F===k?"sel":""} ${F&&F!==k?"dim":""}" ${n[k]?"":"disabled"}><b>${n[k]}</b><span>${lab(k)}</span></button>`).join("")}</div>
    <div class="verdict">${verdict}${items.length?`<small class="tip">위 상자를 누르면 해당 물품만 모아 볼 수 있어요.</small>`:""}</div>
    <div class="items" id="items">${F?`<div class="fbar"><span><b>${lab(F)}</b> ${n[F]}개</span><button type="button" id="fall">전체 보기</button></div>`:""}${items.map((it,i)=>{if(F&&it.cat!==F)return "";const R=it.rule&&RULES[it.rule];return `<article class="it">
      <div class="hd"><span class="no">${i+1}</span><span class="nm">${esc(it.name)}${it.hid?` <span class="hidtag">일부 가려짐</span>`:""}${it.where?`<small class="wh">${esc(it.where)}</small>`:""}</span><span class="chip ${CAT[it.cat].c}">${lab(it.cat)}</span></div>
      <p class="rs">${esc(it.reason)}</p>
      ${keepNear(it)?`<p class="near"><b>기내 선반 보관 금지</b>비행 중에는 꼭 몸에 지니거나 좌석 앞 주머니에 넣어 주세요. 단자는 절연테이프나 지퍼백으로 감싸 주세요.</p>`:""}
      ${it.basis?`<p class="vb"><span>${esc(it.basis)}</span>${esc(it.bnote||"")}</p>`:""}
      ${it.action?`<p class="ac">${esc(it.action)}</p>`:""}
      ${R?`<details class="law"><summary>근거 규정 · ${esc(R.t)}</summary><p>${esc(R.x)}<small>${esc(R.s)}</small></p></details>`:""}
    </article>`;}).join("")}</div>
    <p class="disc">참고용 사전 점검입니다. 사진에 전혀 보이지 않는 물품은 판정할 수 없으니, 옷 아래나 파우치 속 물건은 꺼내서 찍어 주세요. 최종 판단은 보안검색 현장에서 이루어집니다.<br>${state.source==="sample"?"예시 가방의 판정 결과입니다.":"AI가 사진을 보고 판정한 결과입니다."} 규정 출처: 인천국제공항 제한물품 안내 (2026년 10월 확인).</p>
  </div>
  <div class="sticky"><button class="btn p" id="toList" type="button">${todoCount?`체크리스트에 ${todoCount}개 할 일 추가`:"체크리스트 보기"}</button></div>`;
  document.getElementById("toList").onclick=()=>go({screen:"list",checked:{}});
  const jump=()=>{const el=document.getElementById("items");if(!el)return;const top=el.getBoundingClientRect().top-scroller.getBoundingClientRect().top+scroller.scrollTop-12;
    const rm=window.matchMedia("(prefers-reduced-motion: reduce)").matches;scroller.scrollTo({top,behavior:rm?"auto":"smooth"});};
  view.querySelectorAll("[data-f]").forEach(el=>el.onclick=()=>{const f=el.dataset.f;const keep=scroller.scrollTop;state.filter=state.filter===f?null:f;render();scroller.scrollTop=keep;requestAnimationFrame(jump);});
  const fa=document.getElementById("fall");if(fa)fa.onclick=()=>{const keep=scroller.scrollTop;state.filter=null;render();scroller.scrollTop=keep;};
  document.getElementById("swap").onclick=()=>{const m=state.mode==="k"?"c":"k";state.mode=m;
    if(state.bag){go({items:resolve(state.bag,m),filter:null});}else if(state.photo&&((sampleFn&&canImages)||serverOK)){startUpload(state.photo);}};
}

// ---------- Checklist ----------
function renderList(){
  const groups={home:[],checkin:[],security:[]};
  (state.items||[]).forEach((it,i)=>(it.todo||[]).forEach((t,j)=>{if(groups[t[0]])groups[t[0]].push({id:i+"-"+j,text:t[1],why:t[2],cat:it.cat});}));
  const all=[].concat(groups.home,groups.checkin,groups.security);
  const ck=state.checked||{};const done=all.filter(t=>ck[t.id]).length;
  view.innerHTML=`<div class="pad">
    <div class="done-hd"><div class="ck">✓</div><div><b>출국 체크리스트에 ${all.length}개 추가됐어요</b><p>${MODE[state.mode].n} 점검 결과가 단계별 할 일로 정리됐습니다.</p></div></div>
    <div><div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-bottom:6px"><span>완료</span><span style="font-variant-numeric:tabular-nums">${done} / ${all.length}</span></div><div class="prog"><i style="width:${all.length?done/all.length*100:0}%"></i></div></div>
    ${Object.keys(groups).filter(k=>groups[k].length).map(k=>`<section class="grp"><h3><span>${k==="home"?"지금":k==="checkin"?"공항":"공항"}</span>${STAGE[k]}</h3>
      ${groups[k].map(t=>`<button class="todo ${ck[t.id]?"on":""}" data-t="${t.id}" type="button" aria-pressed="${!!ck[t.id]}"><span class="box">${ck[t.id]?"✓":""}</span><span style="min-width:0"><b>${esc(t.text)}</b><small>${esc(t.why)}</small></span><span class="chip tag ${CAT[t.cat].c}">${lab(t.cat)}</span></button>`).join("")}
    </section>`).join("")}
    ${all.length===0?`<p class="verdict">추가할 할 일이 없어요.</p>`:""}
    <div class="next"><b>공항에서는 위치에 맞춰 다시 알려드려요.</b><br>체크인 카운터와 보안검색대 앞에 도착하면, 남은 항목을 능동 체크 알림으로 보여 드립니다.</div>
    <button class="btn s" id="again" type="button">다른 가방 점검하기</button>
  </div>`;
  view.querySelectorAll("[data-t]").forEach(el=>el.onclick=()=>{const c=Object.assign({},state.checked);c[el.dataset.t]=!c[el.dataset.t];state.checked=c;const st=scroller.scrollTop;render();scroller.scrollTop=st;});
  document.getElementById("again").onclick=()=>go({screen:"home",bag:null,photo:null});
}

render();
// Light up live photo judging when this viewer can use Claude with images
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const s=await window.claude.use("sample");
    if(!s)return;
    const lim=await s.limits().catch(()=>null);
    sampleFn=s;canImages=!!(lim&&lim.images);
    if(state.screen==="home")render();
  }catch(e){}
})();
})();
</script>
</body></html>
